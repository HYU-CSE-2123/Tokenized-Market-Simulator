spring:
  config:
    # Gradle을 backend/에서 실행할 때와 IntelliJ를 저장소 루트에서 실행할 때를 모두 지원한다.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: price-tracking-exchange
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exchange}
    username: ${DB_USERNAME:exchange}
    password: ${DB_PASSWORD:exchange}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 schema.sql 로 관리 (기획서 §11)
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always            # schema.sql 자동 실행
      continue-on-error: false # 스키마 오류를 숨기지 않고 기동 실패로 처리

server:
  port: ${SERVER_PORT:8082}

# 애플리케이션 커스텀 설정
app:
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGINS:*}
  admin:
    login-id: ${ADMIN_LOGIN_ID:admin}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:관리자}
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-32bytes-minimum}
    validity-ms: ${JWT_VALIDITY_MS:3600000}   # 1시간
  price:
    provider: ${PRICE_PROVIDER:simulated}
    update-interval-ms: ${PRICE_INTERVAL_MS:1000}  # 기획서 §8.1 가격 시뮬레이터 주기
    toss:
      base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
      client-id: ${TOSS_CLIENT_ID:}
      client-secret: ${TOSS_CLIENT_SECRET:}
      symbol: ${TOSS_SYMBOL:005930}
      connect-timeout: ${TOSS_CONNECT_TIMEOUT:2s}
      read-timeout: ${TOSS_READ_TIMEOUT:5s}
      websocket-url: ${TOSS_WEBSOCKET_URL:wss://openapi-ws.tossinvest.com/ws/v1}
      ping-interval: ${TOSS_WEBSOCKET_PING_INTERVAL:60s}
      reconnect-initial-delay: ${TOSS_WEBSOCKET_RECONNECT_INITIAL_DELAY:1s}
      reconnect-max-delay: ${TOSS_WEBSOCKET_RECONNECT_MAX_DELAY:30s}
      degraded-after: ${TOSS_PRICE_DEGRADED_AFTER:15s}
      stale-after: ${TOSS_PRICE_STALE_AFTER:60s}
      reference-refresh-cron: ${TOSS_REFERENCE_REFRESH_CRON:0 5 0 * * *}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:false}
    rpc-url: ${RPC_URL:http://127.0.0.1:8545}      # 로컬 Anvil / Sepolia
    mock-krw-address: ${MOCK_KRW_ADDRESS:}
    m-sec-address: ${MSEC_ADDRESS:}
    price-oracle-address: ${PRICE_ORACLE_ADDRESS:}
    exchange-vault-address: ${EXCHANGE_VAULT_ADDRESS:}
    operator-private-key: ${OPERATOR_PRIVATE_KEY:}
    price-report:
      enabled: ${PRICE_REPORT_SIGNING_ENABLED:false}
      signer-private-key: ${PRICE_SIGNER_PRIVATE_KEY:}
    reconciliation:
      poll-interval-ms: ${BLOCKCHAIN_RECEIPT_POLL_INTERVAL_MS:1000}
      initial-delay-ms: ${BLOCKCHAIN_RECEIPT_INITIAL_DELAY_MS:1000}
      required-confirmations: ${BLOCKCHAIN_REQUIRED_CONFIRMATIONS:1}
    price-sync:
      enabled: ${BLOCKCHAIN_PRICE_SYNC_ENABLED:false}
      interval-ms: ${BLOCKCHAIN_PRICE_SYNC_INTERVAL_MS:3000}
      initial-delay-ms: ${BLOCKCHAIN_PRICE_SYNC_INITIAL_DELAY_MS:3000}
